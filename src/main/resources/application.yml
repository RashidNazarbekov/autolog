spring:
  application.name: autolog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autolog}
    username: ${DB_USER:autolog}
    password: ${DB_PASSWORD:autolog}
  jpa:
    open-in-view: false
    # Схемой управляет только Flyway
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

autolog:
  # Часовой пояс для «сегодня», дат в боте и отчётах
  zone: Asia/Bishkek
  telegram:
    # Пустой токен — бот не запускается, остальное приложение работает
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # Имя бота без @ — для ссылок-приглашений t.me/<имя>?start=join_КОД
    bot-username: ${TELEGRAM_BOT_USERNAME:}
  reminders:
    # Напомнить водителю, если поездка открыта дольше…
    open-trip-after: 6h
    # …и повторять, пока не закроет
    repeat-every: 12h
    # Тихие часы: с 22 до 8 не пишем, напомним утром
    quiet-from: 22
    quiet-to: 8
