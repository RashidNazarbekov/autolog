name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Тесты используют Testcontainers: Docker на ubuntu-latest уже есть
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee build.log || {
            # Ошибки компиляции и упавшие тесты — в аннотации, чтобы видеть их без скачивания логов
            grep -E "^\[ERROR\] .+" build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports
